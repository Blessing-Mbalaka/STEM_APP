# render.yaml
services:
  - type: web
    name: stem-app
    env: python
    plan: starter               # optional; pick your plan
    autoDeploy: true            # optional

    # Build happens in an isolated environment; OK to run collectstatic here.
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    # Run the app with Gunicorn (your wsgi module name may differ)
    startCommand: gunicorn stem_app.wsgi:application --bind 0.0.0.0:$PORT

    # Run DB migrations AFTER the service is up (build env may not reach DB)
    postDeployCommand: python manage.py migrate

    # Attach a Persistent Disk for MEDIA files
    disks:
      - name: media
        mountPath: /var/data/media
        sizeGB: 5

    envVars:
      # --- Core Django ---
      - key: DJANGO_SETTINGS_MODULE
        value: stem_app.settings
      - key: DEBUG
        value: "False"              # env vars are strings
      - key: SECRET_KEY
        value: "Xn7l6EHITDDEv7ndKjLDFwW4fyLOLPWVDDTFA5tFSnEdFlPyn9HlXEPf7WJQsJA-XdA"
      - key: ALLOWED_HOSTS
        value: "stem-app-sqb4.onrender.com,.onrender.com,localhost,127.0.0.1"

      # --- Database ---
      - key: DATABASE_URL           # prefer setting this in the Render dashboard
        value: "postgresql://stem_app_user:H27a3fiKfi0AXOuSGtKTKSCjpieGRrRT@dpg-d4iesnmr433s739v5nq0-a.oregon-postgres.render.com/stem_app"

      # --- Media (optional: if your settings read this) ---
      - key: MEDIA_ROOT
        value: "/var/data/media"
      - key: MEDIA_URL
        value: "/media/"

      # --- Email (quote values with spaces; better: use fromSecret) ---
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
