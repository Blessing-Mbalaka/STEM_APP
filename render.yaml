# render.yaml
services:
  - type: web
    name: stem-app  # Choose a unique name for your service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn stem_app.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: stem_app.settings
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        value: your-secret-key-here  # Replace with a secure key (generate with `python -c "import secrets; print(secrets.token_urlsafe(50))"`)
      - key: EMAIL_HOST_PASSWORD
        value: your-app-password  # From your .env or settings
      - key: DATABASE_URL
        value: your-database-url  # Provided by Render for PostgreSQL
      - key: ALLOWED_HOSTS
        value: stem-app.onrender.com,localhost,127.0.0.1
      - key: GOOGLE_ANALYTICS_ID
        value: your-ga-id  # Optional
      - key: GEMINI_API_KEY
        value: your-gemini-key  # Optional
      - key: EMAIL_HOST_USER
        value: your-email@gmail.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: DEFAULT_FROM_EMAIL
        value: your-email@gmail.com