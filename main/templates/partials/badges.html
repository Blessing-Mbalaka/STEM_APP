<div class="badge-container">
  {% for badge in badges %}
    <div class="badge">
      <img src="{{ badge.icon.url }}" alt="{{ badge.name }}" class="badge-icon">
      <span class="badge-name">{{ badge.name }}</span>
    </div>
  {% empty %}
    <p class="no-badges">No badges earned yet. Complete more quizzes!</p>
  {% endfor %}
</div>

<style>
.badge-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
  justify-content: center;
}
.badge {
  background: white;
  border-radius: 12px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: transform .2s;
}
.badge:hover { transform: scale(1.05); }
.badge-icon {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  margin-right: 8px;
}
.badge-name { font-weight: 600; font-size: 13px; color: #24adb7; }
.no-badges { color: #666; font-size: 14px; }
</style>
