{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial; background:#f7f7f9; color:#222; }
    .wrap { max-width: 420px; margin: 60px auto; background:#fff; padding:24px; border-radius:12px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    h2 { margin: 0 0 12px 0; color:#24adb7; }
    .row { margin: 12px 0; display:flex; flex-direction:column; gap:6px; }
    label { font-weight:600; color:#444; }
    input[type=password] { padding: 10px 12px; border:1px solid #d0d7de; border-radius:8px; font-size:15px; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn-primary { background:#24adb7; color:#fff; }
    .btn-secondary { background:#e9ecef; color:#222; }
    .err { color:#b00020; font-size: 0.95rem; display:none; }
    .ok { color:#0a7e07; font-size: 0.95rem; display:none; }
    .actions { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Change Password</h2>
    <p style="margin:0 0 12px 0; color:#666">Enter your current password and a new one.</p>
    <div id="msg" class="err"></div>
    <div id="ok" class="ok"></div>
    <form id="cpForm">
      <div class="row"><label for="old">Current Password</label><input id="old" type="password" required /></div>
      <div class="row"><label for="new">New Password</label><input id="new" type="password" minlength="6" required /></div>
      <div class="row"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" minlength="6" required /></div>
      <div class="actions">
        <a href="/profiles/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> Update Password</button>
      </div>
    </form>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script>
    const form = document.getElementById('cpForm');
    const msg = document.getElementById('msg');
    const ok = document.getElementById('ok');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none'; ok.style.display='none';
      const oldp = document.getElementById('old').value;
      const newp = document.getElementById('new').value;
      const conf = document.getElementById('confirm').value;
      if (newp.length < 6) { msg.textContent = 'New password must be at least 6 characters'; msg.style.display='block'; return; }
      if (newp !== conf) { msg.textContent = 'Passwords do not match'; msg.style.display='block'; return; }
      try {
        await api('/api/auth/change-password', { method:'POST', data:{ old_password: oldp, new_password: newp, confirm_password: conf } });
        ok.textContent = 'Password updated successfully'; ok.style.display = 'block';
        setTimeout(()=>{ window.location.href = '/profiles/'; }, 900);
      } catch(e){
        msg.textContent = e?.json?.error || 'Failed to change password';
        msg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
