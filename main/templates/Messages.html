
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --primary-purple: #530475;
      --secondary-purple: #fdb4f7a1;
      --accent-yellow: #FBBC05;
      --accent-green: #34A853;
      --accent-red: #EA4335;
      --light-gray: #f9f9f9;
      --medium-gray: #E0E0E0;
      --dark-gray: #333;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--light-gray);
      color: var(--dark-gray);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1100px;
      margin: 30px auto;
      padding: 16px;
    }

    h2 {
      color: var(--primary-purple);
      font-size: 26px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .card {
      background-color: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }

    label {
      width: 110px;
      font-weight: 600;
      color: var(--dark-gray);
    }

    input[type=text], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--medium-gray);
      transition: all 0.3s ease;
      font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 3px rgba(83,4,117,0.15);
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 30px;
      padding: 8px 18px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn i {
      font-size: 14px;
    }

    .btn.primary {
      background-color: var(--secondary-purple);
      color: var(--primary-purple);
    }

    .btn.primary:hover {
      background-color: #f7aef5;
    }

    .btn.secondary {
      background-color: var(--medium-gray);
      color: var(--dark-gray);
    }

    .btn.secondary:hover {
      background-color: #d0d0d0;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      background-color: white;
      border: 1px solid var(--medium-gray);
      border-radius: 10px;
      padding: 12px;
      box-shadow: var(--card-shadow);
      transition: background 0.2s;
    }

    .item:hover {
      background-color: #faf6fd;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }

    .badge.unread {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    /* Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-bar .btn.secondary {
      border-radius: 20px;
      background-color: white;
      border: 1px solid var(--medium-gray);
      box-shadow: var(--card-shadow);
    }

    .header-bar .btn.secondary:hover {
      background-color: var(--light-gray);
    }

    /* Search area */
    #search {
      border-radius: 20px;
      padding: 8px 14px;
      min-width: 220px;
    }

    /* Sent note */
    #sendNote {
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header-bar">
      <h2>Messages</h2>
      <a href="/index/" class="btn secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <div class="grid">
      <div class="card">
        <h3 style="margin-bottom: 12px; color: var(--primary-purple);">New Message</h3>
        <div class="row">
          <label>To</label><select id="recipient"></select>
        </div>
        <div class="row">
          <label>Subject</label><input id="subject" type="text" placeholder="Optional">
        </div>
        <div class="row">
          <label>Message</label><textarea id="body"></textarea>
        </div>
        <div class="row" style="justify-content: flex-end;">
          <button id="send" class="btn primary"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
        <div id="sendNote" class="muted" style="display:none;">Sent!</div>
      </div>

      <div class="card">
        <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <div>
            <button id="tabInbox" class="btn secondary">Inbox</button>
            <button id="tabSent" class="btn secondary">Sent</button>
          </div>
          <div class="row" style="margin:0;">
            <input id="search" type="text" placeholder="Search messages">
            <button id="doSearch" class="btn secondary"><i class="fas fa-search"></i></button>
          </div>
        </div>

        <div id="listTitle" class="muted" style="margin-bottom:8px;">Inbox</div>
        <div id="inbox" class="list"></div>
      </div>
    </div>
  </div>

   <script>
    async function api(path,{method='GET',data,headers={}}={}){
      const opts={method,headers:{'X-CSRFToken': (document.cookie.match(/csrftoken=([^;]+)/)||[])[1]||'',...headers}};
      if(data!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data)}
      const res=await fetch(path,opts);const json=await res.json().catch(()=>({})); if(!res.ok) throw json; return json;
    }
    function getParam(name){ const m=location.search.match(new RegExp(`[?&]${name}=([^&]+)`)); return m? decodeURIComponent(m[1]) : ''; }
    async function loadRecipients(){
      const data = await api('/api/messages/recipients');
      const sel = document.getElementById('recipient');
      sel.innerHTML = (data.results||[]).map(u=>`<option value="${u.id}">${u.name}</option>`).join('') || '<option value="">No tutors available</option>';
      const pre = getParam('recipient'); if (pre) sel.value = String(pre);
      const subj = getParam('subject'); if (subj) document.getElementById('subject').value = subj;
      const body = getParam('body'); if (body) document.getElementById('body').value = body;
    }
    let currentBox = 'inbox';
    async function loadInbox(){
      const q = document.getElementById('search').value.trim();
      const p = new URLSearchParams(); if(currentBox==='sent') p.set('box','sent'); if(q) p.set('q',q);
      const data = await api('/api/messages' + (p.toString()?`?${p.toString()}`:''));
      const box = document.getElementById('inbox'); box.innerHTML='';
      (data.results||[]).forEach(m=>{
        const div=document.createElement('div');
        div.className='item';
        const created = (m.created_at||'').toString().slice(0,19).replace('T',' ');
        const subj = m.subject || 'Message';
        div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;">
          <div><strong>${subj}</strong> <span class="muted">from ${m.from}</span> ${m.read? '' : '<span class="badge unread">unread</span>'}</div>
          <div class="muted">${created}</div>
        </div>
        <div style="margin-top:6px; white-space:pre-wrap;">${m.body}</div>
        <div class="row" style="justify-content:flex-end; margin-top:8px;"><button class="btn secondary reply">Reply</button></div>`;
        // Mark as read when clicking item body (not the reply button)
        div.addEventListener('click', async (ev)=>{
          if (ev.target && ev.target.classList.contains('reply')) return;
          try{ await api(`/api/messages/${m.id}/read`, { method:'PATCH' }); }catch(_){}
          loadInbox();
        });
        // Reply action
        div.querySelector('.reply').addEventListener('click', (ev)=>{
          ev.stopPropagation();
          const sel = document.getElementById('recipient'); if (m.sender_id) sel.value = String(m.sender_id);
          document.getElementById('subject').value = m.subject ? `Re: ${m.subject}` : '';
          document.getElementById('body').focus();
        });
        box.appendChild(div);
      });
    }
    document.getElementById('send').addEventListener('click', async ()=>{
      const rid = parseInt(document.getElementById('recipient').value||'0',10);
      const subject = document.getElementById('subject').value.trim();
      const body = document.getElementById('body').value.trim();
      if(!rid || !body){ alert('Recipient and message are required'); return; }
      try{
        await api('/api/messages/send', { method:'POST', data:{ recipient_id: rid, subject, body }});
        document.getElementById('subject').value=''; document.getElementById('body').value='';
        const note = document.getElementById('sendNote'); note.style.display='block'; setTimeout(()=> note.style.display='none', 1500);
        loadInbox();
      }catch(e){ alert(e.error||'Failed to send'); }
    });
    document.getElementById('tabInbox').addEventListener('click', ()=>{ currentBox='inbox'; document.getElementById('listTitle').textContent='Inbox'; loadInbox(); });
    document.getElementById('tabSent').addEventListener('click', ()=>{ currentBox='sent'; document.getElementById('listTitle').textContent='Sent'; loadInbox(); });
    document.getElementById('doSearch').addEventListener('click', ()=> loadInbox());
    document.addEventListener('DOMContentLoaded', ()=>{ loadRecipients(); loadInbox(); });
  </script>
  <script>
    async function api(path,{method='GET',data,headers={}}={}){ ... } // (keep your entire JS logic unchanged)
  </script>
</body>
</html>
