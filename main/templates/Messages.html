




























{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-TZRMSJGL4N"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-TZRMSJGL4N'); </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --primary-orange: rgb(184, 67, 0);
      --secondary-orange: rgb(128, 49, 3);
      --accent-yellow: #FBBC05;
      --accent-green: #34A853;
      --accent-red: #EA4335;
      --light-gray: #F5F5F5;
      --medium-gray: #E0E0E0;
      --dark-gray: #333333;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      --panel-radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f9f9f9;
      color: var(--dark-gray);
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 24px 0 30px;
      background-image: linear-gradient(180deg, #f4e2ce9d, #f6f6f6), url("{% static 'images/wallpaper7.jpg' %}");
      background-size: cover;
      background-position: center;
      color: var(--secondary-orange);
      border-radius: var(--panel-radius);
      box-shadow: var(--card-shadow);
      position: relative;
    }

    header h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .back-to-dashboard {
      position: absolute;
      left: 20px;
      top: 20px;
      padding: 8px 15px;
      background-color: white;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--card-shadow);
      border: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--primary-orange);
    }

    .back-to-dashboard:hover {
      background-color: var(--light-gray);
      transform: translateY(-2px);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .card {
      background-color: white;
      border-radius: var(--panel-radius);
      padding: 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--medium-gray);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
    }

    label {
      width: 110px;
      font-weight: 600;
      color: var(--dark-gray);
    }

    input[type=text], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--medium-gray);
      transition: all 0.3s ease;
      font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 3px rgba(184,67,0,0.15);
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 30px;
      padding: 8px 18px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn i {
      font-size: 14px;
    }

    .btn.primary {
      background-color: var(--primary-orange);
      color: #fff;
    }

    .btn.primary:hover {
      background-color: var(--secondary-orange);
    }

    .btn.secondary {
      background-color: white;
      color: var(--secondary-orange);
      border: 1px solid var(--medium-gray);
      box-shadow: var(--card-shadow);
    }

    .btn.secondary:hover {
      background-color: var(--light-gray);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      background-color: #fff7f2;
      border: 1px solid rgba(184, 67, 0, 0.18);
      border-radius: 10px;
      padding: 12px;
      box-shadow: var(--card-shadow);
      transition: background 0.2s;
    }

    .item:hover {
      background-color: #fff2e9;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .badge.unread {
      background-color: rgba(184, 67, 0, 0.12);
      color: var(--secondary-orange);
      border: 1px solid rgba(184, 67, 0, 0.18);
    }

    /* Header bar for search/buttons */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    #search {
      border-radius: 20px;
      padding: 8px 14px;
      min-width: 220px;
      border: 1px solid var(--medium-gray);
    }

    #sendNote {
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }




       /* Mobile adjustments: reduce fonts, spacing and make controls fit */
   @media (max-width: 480px) {
     html { font-size: 14px; }
     header h2 { font-size: 20px; }
      header p { font-size: 13px; }
      .wrap { padding: 12px; }
      .grid { gap: 12px; }
      .card { padding: 14px; border-radius: 12px; }
      .back-to-dashboard { left: 12px; top: 12px; padding: 6px 10px; font-size: 13px; }
      label { width: 90px; font-size: 13px; }
      input[type=text], select, textarea { font-size: 14px; padding: 8px 10px; }
      textarea { min-height: 90px; }
      .btn { padding: 6px 12px; font-size: 13px; }
     #search { min-width: 140px; }
      .item { padding: 10px; }
     .muted { font-size: 12px; }
  }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a href="/index/" class="back-to-dashboard">
        <i class="fas fa-arrow-left"></i> Back
      </a>
      <h2>Messages</h2>
      <p>Send and receive messages securely within your dashboard.</p>
    </header>

    <div class="wrap">
      <div class="grid">
        <div class="card">
          <h3 style="margin-bottom: 12px; color: var(--secondary-orange);">New Message</h3>
          <div class="row">
            <label>To</label><select id="recipient"></select>
          </div>
          <div class="row">
            <label>Subject</label><input id="subject" type="text" placeholder="Optional">
          </div>
          <div class="row">
            <label>Message</label><textarea id="body"></textarea>
          </div>
          <div class="row" style="justify-content: flex-end;">
            <input id="attachment" type="file" accept="image/*,.pdf" aria-label="Attach payment proof or document">
            <button id="send" class="btn primary"><i class="fas fa-paper-plane"></i> Send</button>
          </div>
          <div id="sendNote" class="muted" style="display:none;">Sent!</div>
        </div>

        <div class="card">
          <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
              <button id="tabInbox" class="btn secondary">Inbox</button>
              <button id="tabSent" class="btn secondary">Sent</button>
            </div>
            <div class="row" style="margin:0;">
              <input id="search" type="text" placeholder="Search messages">
              <button id="doSearch" class="btn secondary"><i class="fas fa-search"></i></button>
            </div>
          </div>

          <div id="listTitle" class="muted" style="margin-bottom:8px;">Inbox</div>
          <div id="inbox" class="list"></div>
        </div>
      </div>
    </div>
  </div>




  <script>
  async function api(path, { method='GET', data, headers={} } = {}) {
    try {
      const opts = {
        method,
        headers: {
          'X-CSRFToken': (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '',
          ...headers
        }
      };
      if (data !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(data);
      }

      const res = await fetch(path, opts);
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw json;
      return json;
    } catch (error) {
      console.error('Network or fetch error:', error);
      alert('Network error: Unable to connect. Please check your connection or try again later.');
      throw error; // rethrow so the calling functions handle it too
    }
  }

  function getParam(name) {
    const m = location.search.match(new RegExp(`[?&]${name}=([^&]+)`));
    return m ? decodeURIComponent(m[1]) : '';
  }

  async function loadRecipients() {
    try {
      const data = await api('/api/messages/recipients');
      const sel = document.getElementById('recipient');
      sel.innerHTML =
        (data.results || [])
          .map(u => `<option value="${u.id}">${u.name}</option>`)
          .join('') || '<option value="">No tutors available</option>';
      const pre = getParam('recipient'); if (pre) sel.value = String(pre);
      const subj = getParam('subject'); if (subj) document.getElementById('subject').value = subj;
      const body = getParam('body'); if (body) document.getElementById('body').value = body;
    } catch (error) {
      console.error('Failed to load recipients:', error);
      alert('Network issue while loading recipients. Please refresh the page.');
    }
  }

  let currentBox = 'inbox';
  async function loadInbox() {
    try {
      const q = document.getElementById('search').value.trim();
      const p = new URLSearchParams();
      if (currentBox === 'sent') p.set('box', 'sent');
      if (q) p.set('q', q);

      const data = await api('/api/messages' + (p.toString() ? `?${p.toString()}` : ''));
      const box = document.getElementById('inbox');
      box.innerHTML = '';
      (data.results || []).forEach(m => {
        const div = document.createElement('div');
        div.className = 'item';
        const created = (m.created_at || '').toString().slice(0, 19).replace('T', ' ');
        const subj = m.subject || 'Message';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><strong>${subj}</strong> <span class="muted">from ${m.from}</span> ${m.read ? '' : '<span class="badge unread">unread</span>'}</div>
            <div class="muted">${created}</div>
          </div>
          <div style="margin-top:6px; white-space:pre-wrap;">${m.body}</div>
          ${m.attachment_url ? `<div style="margin-top:8px"><a href="${m.attachment_url}" target="_blank" rel="noopener"><i class="fas fa-paperclip"></i> ${m.attachment_name || 'View attachment'}</a></div>` : ''}
          <div class="row" style="justify-content:flex-end; margin-top:8px;">
            <button class="btn secondary reply">Reply</button>
          </div>`;

        div.addEventListener('click', async (ev) => {
          if (ev.target && ev.target.classList.contains('reply')) return;
          try {
            await api(`/api/messages/${m.id}/read`, { method: 'PATCH' });
          } catch (error) {
            console.warn('Failed to mark as read:', error);
          }
          loadInbox();
        });

        div.querySelector('.reply').addEventListener('click', (ev) => {
          ev.stopPropagation();
          const sel = document.getElementById('recipient');
          if (m.sender_id) sel.value = String(m.sender_id);
          document.getElementById('subject').value = m.subject ? `Re: ${m.subject}` : '';
          document.getElementById('body').focus();
        });
        box.appendChild(div);
      });
    } catch (error) {
      console.error('Failed to load inbox:', error);
      alert('Network issue while loading messages. Please check your connection.');
    }
  }

  document.getElementById('send').addEventListener('click', async () => {
    const rid = parseInt(document.getElementById('recipient').value || '0', 10);
    const subject = document.getElementById('subject').value.trim();
    const body = document.getElementById('body').value.trim();
    const selectedAttachment = document.getElementById('attachment').files[0];
    if (!rid || (!body && !selectedAttachment)) { alert('Recipient and a message or attachment are required'); return; }

    try {
      const attachment = document.getElementById('attachment').files[0];
      if (attachment) {
        const fd = new FormData();
        fd.append('recipient_id', rid); fd.append('subject', subject); fd.append('body', body); fd.append('attachment', attachment);
        const relatedSession = getParam('related_session'); if (relatedSession) fd.append('related_session', relatedSession);
        const csrf = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
        const res = await fetch('/api/messages/send', {method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf}, body:fd});
        if (!res.ok) throw await res.json();
      } else {
        await api('/api/messages/send', { method: 'POST', data: { recipient_id: rid, subject, body, related_session: getParam('related_session') || null } });
      }
      document.getElementById('subject').value = '';
      document.getElementById('body').value = '';
      document.getElementById('attachment').value = '';
      const note = document.getElementById('sendNote');
      note.style.display = 'block';
      setTimeout(() => note.style.display = 'none', 1500);
      loadInbox();
    } catch (e) {
      console.error('Failed to send message:', e);
      alert(e.error || 'Failed to send. Please check your connection.');
    }
  });

  document.getElementById('tabInbox').addEventListener('click', () => {
    currentBox = 'inbox';
    document.getElementById('listTitle').textContent = 'Inbox';
    loadInbox();
  });

  document.getElementById('tabSent').addEventListener('click', () => {
    currentBox = 'sent';
    document.getElementById('listTitle').textContent = 'Sent';
    loadInbox();
  });

  document.getElementById('doSearch').addEventListener('click', () => loadInbox());
  document.addEventListener('DOMContentLoaded', () => { loadRecipients(); loadInbox(); });
</script>

</body>
</html>
