{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial;background:#f7f7f9;color:#222}
    .wrap{max-width:1200px;margin:20px auto;padding:16px}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .row{display:flex;gap:10px;align-items:center;margin:8px 0}
    input[type=text],select{padding:8px 10px;border:1px solid #d0d7de;border-radius:8px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #e6eaef;text-align:left}
    th{background:#f4f6f8}
    .btn{background:#24adb7;color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer}
    .btn.secondary{background:#e9ecef;color:#222}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin-left:6px;border:1px solid #ddd}
    .pill.green{background:#e8f5e9;color:#2e7d32;border-color:#c8e6c9}
    .pill.orange{background:#fff8e1;color:#ef6c00;border-color:#ffe0b2}
    .role-wrapper{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    .role-summary{font-size:13px;color:#555}
    .role-select{padding:6px 10px;border:1px solid #d0d7de;border-radius:8px;background:#fff;font-size:13px;min-width:140px}
    .role-select:disabled{opacity:.6;cursor:wait}
    #admin-toast-container{position:fixed;top:18px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:2000}
    .admin-toast{background:#24adb7;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.15);font-weight:600;min-width:220px;max-width:340px;opacity:0;transform:translateY(-8px);transition:opacity .25s ease,transform .25s ease;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .admin-toast.show{opacity:1;transform:translateY(0)}
    .admin-toast.error{background:#d9534f}
    .admin-toast button{background:transparent;border:none;color:inherit;font-size:16px;cursor:pointer;line-height:1}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <h2 style="margin:0;color:#24adb7;">User Management</h2>
      <a href="/administrator/" class="btn secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card">
      <div class="row">
        <input id="q" type="text" placeholder="Search username/email" style="flex:1;">
        <select id="role"><option value="">All roles</option><option value="student">Students</option><option value="tutor">Tutors</option><option value="admin">Admins</option></select>
        <select id="status"><option value="">All status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
        <button id="refresh" class="btn">Refresh</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>User</th><th>Email</th><th>Roles</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="admin-toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script>
    const adminConfig = {
      isSuperuser: {{ request.user.is_superuser|yesno:"true,false" }},
      currentUser: "{{ request.user.username|escapejs }}"
    };
    const toastContainer = document.getElementById('admin-toast-container');

    function csrfToken(){
      return (document.cookie.match(/csrftoken=([^;]+)/)||[])[1]||'';
    }
    async function api(path,{method='GET',data,headers={}}={}){
      const opts={method,headers:{'X-CSRFToken': csrfToken(),...headers}};
      if(data!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data);}
      const res=await fetch(path,opts);
      const json=await res.json().catch(()=>({}));
      if(!res.ok) throw json;
      return json;
    }
    function roleLabels(user){
      const rawRoles=Array.isArray(user.roles)?user.roles:[];
      const roleSet=new Set();
      rawRoles.forEach(r=>{
        const value=(r||'').toString().trim().toLowerCase();
        if(value) roleSet.add(value);
      });
      if(!roleSet.size){
        if(user.is_superuser||user.is_staff) roleSet.add('admin');
        if(user.is_tutor) roleSet.add('tutor');
      }
      if(!roleSet.size){
        roleSet.add('student');
      }
      const labelMap={
        admin:'Admin',
        superuser:'Admin',
        tutor:'Tutor',
        student:'Student',
        anonymous:'Guest'
      };
      return Array.from(roleSet).map(role=>labelMap[role] || (role.charAt(0).toUpperCase()+role.slice(1))).join(', ');
    }
    function determineRole(user){
      if(user.role) return (user.role||'').toString().toLowerCase();
      if(Array.isArray(user.roles) && user.roles.length){
        return (user.roles[0]||'').toString().toLowerCase();
      }
      if(user.is_superuser||user.is_staff) return 'admin';
      if(user.is_tutor) return 'tutor';
      return 'student';
    }
    function makeButton(label, handler){
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='btn secondary';
      btn.textContent=label;
      btn.addEventListener('click', async ()=>{
        if(btn.disabled) return;
        try{
          await handler(btn);
        }catch(err){
          console.error(err);
        }
      });
      return btn;
    }
    function showToast(message,type='success'){
      if(!toastContainer) return;
      const toast=document.createElement('div');
      toast.className=`admin-toast ${type==='error'?'error':''}`;
      const text=document.createElement('span');
      text.textContent=message;
      const close=document.createElement('button');
      close.setAttribute('aria-label','Dismiss notification');
      close.innerHTML='&times;';
      close.addEventListener('click',()=>toast.remove());
      toast.append(text,close);
      toastContainer.appendChild(toast);
      requestAnimationFrame(()=>toast.classList.add('show'));
      setTimeout(()=>toast.classList.remove('show'),2600);
      setTimeout(()=>toast.remove(),3000);
    }
    function applyRowUpdate(user){
      if(!user) return;
      const row=document.querySelector(`tr[data-user-id="${user.id}"]`);
      if(!row){ load(); return; }
      const roleFilter=(document.getElementById('role').value||'').toLowerCase();
      const statusFilter=(document.getElementById('status').value||'').toLowerCase();
      const searchValue=(document.getElementById('q').value||'').trim().toLowerCase();
      const roleSet=new Set();
      if(Array.isArray(user.roles)){
        user.roles.forEach(r=>{
          const v=(r||'').toString().toLowerCase();
          if(v) roleSet.add(v);
        });
      }
      if(!roleSet.size){
        if(user.is_superuser||user.is_staff) roleSet.add('admin');
        if(user.is_tutor) roleSet.add('tutor');
      }
      if(!roleSet.size){
        roleSet.add('student');
      }
      let matchesRole=true;
      if(roleFilter==='tutor') matchesRole=roleSet.has('tutor');
      else if(roleFilter==='admin'||roleFilter==='staff') matchesRole=roleSet.has('admin');
      else if(roleFilter==='student') matchesRole=roleSet.has('student');
      let matchesStatus=true;
      if(statusFilter==='active') matchesStatus=!!user.is_active;
      else if(statusFilter==='inactive') matchesStatus=!user.is_active;
      let matchesSearch=true;
      if(searchValue){
        const haystack=[user.username||'',user.email||'',user.display_name||'',user.first_name||'',user.last_name||''].join(' ').toLowerCase();
        matchesSearch=haystack.includes(searchValue);
      }
      if(!matchesRole || !matchesStatus || !matchesSearch){
        row.remove();
        if(!document.querySelector('#tbody tr')){
          load();
        }
        return;
      }
      const display=row.querySelector('.user-display');
      if(display) display.textContent=user.display_name||user.username;
      const meta=row.querySelector('.user-meta');
      if(meta) meta.textContent=user.username;
      const roleSummary=row.querySelector('.role-summary');
      if(roleSummary) roleSummary.textContent=roleLabels(user);
      const roleSelect=row.querySelector('.role-select');
      if(roleSelect){
        const newRole=determineRole(user);
        roleSelect.value=newRole;
        Array.from(roleSelect.options).forEach(opt=>{
          if(opt.value==='admin'){
            opt.disabled=!adminConfig.isSuperuser;
          }
        });
      }
      const pill=row.querySelector('.status-pill');
      if(pill){
        pill.className=`pill ${user.is_active?'green':'orange'} status-pill`;
        pill.textContent=user.is_active?'Active':'Inactive';
      }
      const activeBtn=row.querySelector('button[data-act="toggle_active"]');
      if(activeBtn){
        activeBtn.textContent=user.is_active?'Deactivate':'Activate';
      }
    }
    async function updateUser(id,payload,control){
      if(control) control.disabled=true;
      try{
        const res=await api(`/api/admin/users/${id}`,{method:'PATCH',data:payload});
        const updated=res.user||null;
        if(updated){
          applyRowUpdate(updated);
          const name=(updated.display_name&&updated.display_name.trim())||updated.username||'User';
          showToast(`Changes saved for ${name}`);
        }else{
          showToast('Changes saved');
          await load();
        }
        return res.user||null;
      }catch(e){
        showToast(e.error||'Failed to update user','error');
        throw e;
      }finally{
        if(control) control.disabled=false;
      }
    }
    async function editUser(user){
      const currentDisplay=user.display_name||user.username||'';
      const displayInput=prompt('Enter display name',currentDisplay);
      if(displayInput===null) return;
      const trimmed=displayInput.trim();
      if(trimmed.length>150){alert('Display name must be 150 characters or fewer.');return;}
      const payload={display_name:trimmed};
      if(trimmed){
        if(!user.display_name){
          const parts=trimmed.split(/\s+/);
          payload.first_name=parts[0]||'';
          payload.last_name=parts.slice(1).join(' ');
        }else{
          const updateNames=confirm('Update first and last name values as well?');
          if(updateNames){
            const firstPrompt=prompt('First name',user.first_name||trimmed.split(/\s+/)[0]||'');
            if(firstPrompt===null) return;
            const lastPrompt=prompt('Last name',user.last_name||trimmed.split(/\s+/).slice(1).join(' '));
            if(lastPrompt===null) return;
            payload.first_name=firstPrompt.trim();
            payload.last_name=lastPrompt.trim();
          }
        }
      }
      const updated=await updateUser(user.id,payload);
      if(updated) Object.assign(user,updated);
    }
    function buildRoleCell(user){
      const roleCell=document.createElement('td');
      const roleWrapper=document.createElement('div');
      roleWrapper.className='role-wrapper';
      const roleSummary=document.createElement('div');
      roleSummary.className='role-summary';
      roleSummary.textContent=roleLabels(user);
      roleWrapper.appendChild(roleSummary);
      const roleSelect=document.createElement('select');
      roleSelect.className='role-select';
      const options=[
        {value:'student',label:'Student'},
        {value:'tutor',label:'Tutor'},
        {value:'admin',label:'Admin',disabled:!adminConfig.isSuperuser}
      ];
      options.forEach(opt=>{
        const option=document.createElement('option');
        option.value=opt.value;
        option.textContent=opt.label;
        if(opt.disabled) option.disabled=true;
        roleSelect.appendChild(option);
      });
      roleSelect.value=determineRole(user);
      roleSelect.addEventListener('change', async ()=>{
        const selected=roleSelect.value;
        const original=determineRole(user);
        if(selected===original) return;
        if(!adminConfig.isSuperuser && selected==='admin'){
          roleSelect.value=original;
          showToast('Only superusers may assign the admin role','error');
          return;
        }
        const payload={role:selected};
        if(selected==='student'){
          payload.is_tutor=false;
          if(adminConfig.isSuperuser) payload.is_staff=false;
        }else if(selected==='tutor'){
          payload.is_tutor=true;
          if(adminConfig.isSuperuser) payload.is_staff=false;
        }else if(selected==='admin'){
          payload.is_tutor=false;
          if(adminConfig.isSuperuser) payload.is_staff=true;
        }
        try{
          const updated=await updateUser(user.id,payload,roleSelect);
          if(updated){
            Object.assign(user,updated);
            roleSummary.textContent=roleLabels(updated);
            roleSelect.value=determineRole(updated);
          }
        }catch(err){
          roleSelect.value=original;
        }
      });
      roleWrapper.appendChild(roleSelect);
      roleCell.appendChild(roleWrapper);
      return roleCell;
    }
    async function load(){
      const q=document.getElementById('q').value.trim();
      const role=document.getElementById('role').value;
      const status=document.getElementById('status').value;
      const p=new URLSearchParams();
      if(q) p.set('q',q);
      if(role) p.set('role',role);
      if(status) p.set('status',status);
      const tb=document.getElementById('tbody');
      tb.innerHTML='';
      try{
        const data=await api('/api/admin/users'+(p.toString()?('?' + p.toString()):''));
        const users=data.results||[];
        if(!users.length){
          const empty=document.createElement('tr');
          const cell=document.createElement('td');
          cell.colSpan=5;
          cell.style.textAlign='center';
          cell.style.padding='18px';
          cell.textContent='No users found.';
          empty.appendChild(cell);
          tb.appendChild(empty);
          return;
        }
        users.forEach(user=>{
          const tr=document.createElement('tr');
          tr.dataset.userId=user.id;

          const userCell=document.createElement('td');
          const display=document.createElement('div');
          display.style.fontWeight='600';
          display.className='user-display';
          display.textContent=user.display_name||user.username||'(No name)';
          const meta=document.createElement('div');
          meta.style.fontSize='12px';
          meta.style.color='#6c757d';
          meta.className='user-meta';
          meta.textContent=user.username;
          userCell.append(display,meta);

          const emailCell=document.createElement('td');
          emailCell.textContent=user.email||'';

          const roleCell=buildRoleCell(user);

          const statusCell=document.createElement('td');
          const pill=document.createElement('span');
          pill.className=`pill ${user.is_active?'green':'orange'} status-pill`;
          pill.textContent=user.is_active?'Active':'Inactive';
          statusCell.appendChild(pill);

          const actionsCell=document.createElement('td');
          actionsCell.appendChild(makeButton('Edit Name',()=>editUser(user)));
          const toggleActiveBtn=makeButton(user.is_active?'Deactivate':'Activate',(btn)=>updateUser(user.id,{is_active:!user.is_active},btn).then(updated=>{ if(updated) Object.assign(user,updated); }));
          toggleActiveBtn.dataset.act='toggle_active';
          actionsCell.appendChild(toggleActiveBtn);

          tr.append(userCell,emailCell,roleCell,statusCell,actionsCell);
          tb.appendChild(tr);
        });
      }catch(err){
        const row=document.createElement('tr');
        const cell=document.createElement('td');
        cell.colSpan=5;
        cell.style.textAlign='center';
        cell.style.padding='18px';
        cell.textContent=err.error||'Failed to load users.';
        row.appendChild(cell);
        tb.appendChild(row);
        showToast(err.error||'Failed to load users','error');
      }
    }
    document.getElementById('refresh').addEventListener('click', load);
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
