{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password • STEAM Explorers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --powder-blue:#A7D8F2; --dark-blue:#041667; --white:#FFF; --gray:#E0E0E0; }
    body { font-family: 'Poppins', sans-serif; margin:0; background: var(--powder-blue); }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { width:100%; max-width:420px; background:#fff; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.08); padding:20px; }
    h2 { margin:0 0 8px 0; color: var(--dark-blue); }
    p { color:#444; margin:0 0 14px 0; }
    label { display:block; font-weight:600; margin:8px 0 6px; color:#333; }
    input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--gray); border-radius:8px; }
    .btn { width:100%; margin-top:12px; background:#24adb7; color:#fff; border:none; border-radius:8px; padding:12px; font-weight:600; cursor:pointer; }
    .muted { color:#666; font-size:.9rem; }
    .note { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9; padding:8px 10px; border-radius:8px; margin-top:10px; display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Set a new password</h2>
      <p class="muted">Enter and confirm your new password below.</p>
      <label for="rp-new">New Password</label>
      <input type="password" id="rp-new" placeholder="Min 6 characters" />
      <label for="rp-confirm">Confirm Password</label>
      <input type="password" id="rp-confirm" />
      <div id="rp-error" class="muted" style="color:#b00020; display:none;"></div>
      <button id="rp-submit" class="btn">Reset Password</button>
      <div id="rp-note" class="note">Password updated. You can now <a href="/login/">log in</a>.</div>
    </div>
  </div>
  <script>
    const UIDB64 = "{{ uidb64|escapejs }}";
    const TOKEN = "{{ token|escapejs }}";
  </script>
  <script src="{% static 'js/api.js' %}"></script>
  <script>
    document.getElementById('rp-submit').addEventListener('click', async ()=>{
      const err = document.getElementById('rp-error');
      const note = document.getElementById('rp-note');
      err.style.display = 'none'; err.textContent = '';
      note.style.display = 'none';
      const newp = document.getElementById('rp-new').value;
      const conf = document.getElementById('rp-confirm').value;
      if (!newp || newp.length < 6){ err.textContent='Password must be at least 6 characters'; err.style.display='block'; return; }
      if (newp !== conf){ err.textContent='Passwords do not match'; err.style.display='block'; return; }
      const btn = document.getElementById('rp-submit'); btn.disabled = true; btn.textContent = 'Saving...';
      try {
        await api('/api/auth/reset-password', { method:'POST', data:{ uidb64: UIDB64, token: TOKEN, new_password: newp, confirm_password: conf }});
        note.style.display = 'block';
        // Auto-redirect to login after success
        setTimeout(()=>{ window.location.href = '/login/'; }, 2000);
      } catch (e) {
        err.textContent = e.json?.error || 'Reset link is invalid or expired'; err.style.display='block';
      } finally { btn.disabled = false; btn.textContent = 'Reset Password'; }
    });
  </script>
</body>
</html>
